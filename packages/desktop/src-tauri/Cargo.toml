[package]
name = "sala-campanha"
version = "0.1.0"
description = "Sala da Campanha desktop app"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2"
# shortcut: pinned to the npm @tauri-apps/plugin-notification minor (2.7); move both to 2.8 once pnpm's release-age policy admits npm 2.8.0.
tauri-plugin-notification = "~2.7"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
